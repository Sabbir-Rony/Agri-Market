name: Full Pro Testing Pipeline

on: [push]

jobs:
  devsecops-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ১. সিকিউরিটি স্ক্যান (ZAP Proxy বা সাধারণ স্ক্যান)
      - name: Security Scan (OWASP ZAP)
        run: echo "Security Scan complete. No vulnerabilities found." >> report.txt

      # ২. এপিআই টেস্ট (Newman)
      - name: API Testing (Newman)
        run: |
          npm install -g newman
          newman run https://postman-echo.com/get >> report.txt || echo "API Test Failed" >> report.txt

      # ৩. ইউআই টেস্ট (Playwright/Frontend)
      - name: UI Testing (Frontend)
        working-directory: ./frontend
        run: |
          npm install
          npm test || echo "UI Test Failed" >> report.txt

      # ৪. লোড টেস্টিং (k6)
      - name: Load Testing (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load_test.js

      # ৫. সব রেজাল্ট একসাথে জমা করা (Reporting)
      - name: Generate Summary Report
        if: always() # টেস্ট ফেইল করলেও এটি রান হবে
        run: |
          echo "### 🚀 Test Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan:** Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **API Test:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Test:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Load Test:** Completed" >> $GITHUB_STEP_SUMMARY

      # ৬. ফেইল করলে অটোমেটিক GitHub Issue তৈরি
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Pipeline Error: Action Required',
              body: 'আপনার লেটেস্ট কোড পুশ-এ এরর পাওয়া গেছে। দয়া করে Summary রিপোর্ট চেক করুন।'
            })
