name: Test Pipeline

on: [push]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          pip install pytest # pytest ইনস্টল করছি টেস্ট রান করার জন্য
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      # এখানে আমরা বলছি টেস্ট ফাইলটা রান করো
      - name: Run Pytest
        working-directory: ./backend
        run: pytest 

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
      
      # এখানে আমরা ফ্রন্টএন্ড টেস্ট রান করছি
      - name: Run NPM Test
        working-directory: ./frontend
        run: npm test
