name: DevSecOps Pipeline

on: [push]

jobs:
  # ১. সিকিউরিটি স্ক্যান (CodeQL)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript, python'
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ২. এপিআই এবং ইউআই টেস্ট
  automated-tests:
    needs: security-scan # সিকিউরিটি পাস করলেই কেবল টেস্ট শুরু হবে
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # API Test (Newman)
      - name: Install Newman
        run: npm install -g newman
      - name: Run API Tests
        run: |
          # যদি আপনার পোস্টম্যান কালেকশন ফাইল থাকে তবে এখানে দিন
          newman run https://postman-echo.com/get || echo "API Test failed"

      # UI Test (Playwright)
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run Playwright Tests
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps
          npm test || echo "UI Test failed"

  # ৩. লোড টেস্টিং (k6)
  load-test:
    needs: automated-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load_test.js # এই ফাইলটি আমরা নিচের ধাপে তৈরি করবো

  # ৪. রিপোর্ট জেনারেশন ও ইস্যু তৈরি
  create-issue-on-failure:
    needs: [security-scan, automated-tests, load-test]
    if: failure() # যদি উপরের কোনো ধাপ ফেইল করে তবেই এটি চলবে
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ CI/CD Pipeline Failed',
              body: 'আপনার প্রজেক্টের লেটেস্ট পুশ-এ এরর পাওয়া গেছে। দয়া করে Actions ট্যাব থেকে লগগুলো চেক করুন।'
            })
