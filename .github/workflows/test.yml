name: Test Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      # এটি এখন backend ফোল্ডারে গিয়ে npm install চালাবে
      working-directory: ./backend 
      run: npm install

    - name: API Test
      working-directory: ./backend
      run: echo "Run your Newman commands here"

    - name: UI Test
      working-directory: ./backend
      run: echo "Run your Selenium commands here"
