databases:
  - name: preharvest-db
    plan: free
    databaseName: preharvest
    user: preharvest

services:
  - type: web
    name: preharvest-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: preharvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: APP_NAME
        value: Pre-Harvest Marketplace
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: PAYMENT_GATEWAY_ENABLED
        value: "true"
      - key: INSURANCE_ENABLED
        value: "true"
      - key: INSURANCE_PROVIDER
        value: Platform Insurance
